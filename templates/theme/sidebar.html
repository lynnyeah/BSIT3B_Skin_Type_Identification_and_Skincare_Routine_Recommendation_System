<aside class="navbar navbar-vertical navbar-expand-lg navbar-dark dh-sidebar">
  <div class="container-fluid">
    <div class="navbar-brand navbar-brand-autodark dh-brand">
      <a href="{% url 'dashboard' %}" class="d-flex align-items-center gap-2 text-decoration-none">
        <span class="dh-brand-mark">
          <i class="fa-solid fa-shield-halved"></i>
        </span>
        <span class="lh-1">
          <span class="dh-brand-name">Skin<span class="text-warning"> Type</span></span>
          <span class="dh-brand-sub">Management System</span>
        </span>
      </a>
    </div>

    <button
      class="navbar-toggler"
      type="button"
      data-bs-toggle="collapse"
      data-bs-target="#sidebar-menu"
      aria-controls="sidebar-menu"
      aria-expanded="false"
      aria-label="Toggle navigation"
      >
      <span class="navbar-toggler-icon"></span>
    </button>

    <div class="collapse navbar-collapse" id="sidebar-menu">
      <ul class="navbar-nav pt-lg-2 py-lg-2">

        <li class="nav-item">
          <span class="dh-nav-section">
            Menu
          </span>
        </li>
        <li class="nav-item mb-1">
          <a class="nav-link {% if request.resolver_match.url_name == 'dashboard' %}active{% endif %}"
             href="{% url 'dashboard' %}">
            <span class="nav-link-icon d-md-none d-lg-inline-block">
              <i class="fa-solid fa-chart-pie"></i>
            </span>
            <span class="nav-link-title">Dashboard</span>
          </a>
        </li>

        <li class="nav-item">
          <a class="nav-link {% if request.resolver_match.url_name == 'skin_analysis' or request.resolver_match.url_name == 'analysis' %}active{% endif %}"
             href="{% url 'skin_analysis' %}">
            <span class="nav-link-icon d-md-none d-lg-inline-block">
              <i class="fa-solid fa-magnifying-glass"></i>
            </span>
            <span class="nav-link-title">Skin Analysis</span>
          </a>
        </li>

        <li class="nav-item">
          <a class="nav-link {% if request.resolver_match.url_name == 'my_recommendations' or request.resolver_match.url_name == 'recommendations' %}active{% endif %}"
             href="{% url 'my_recommendations' %}">
            <span class="nav-link-icon d-md-none d-lg-inline-block">
              <i class="fa-solid fa-lightbulb"></i>
            </span>
            <span class="nav-link-title">My Recommendations</span>
          </a>
        </li>

        <li class="nav-item">
          <a class="nav-link {% if request.resolver_match.url_name == 'routine_planner' %}active{% endif %}"
             href="{% url 'routine_planner' %}">
            <span class="nav-link-icon d-md-none d-lg-inline-block">
              <i class="fa-solid fa-calendar-days"></i>
            </span>
            <span class="nav-link-title">Routine Planner</span>
          </a>
        </li>

        <li class="nav-item">
          <a class="nav-link {% if request.resolver_match.url_name == 'assessment_history' %}active{% endif %}"
             href="{% url 'assessment_history' %}">
            <span class="nav-link-icon d-md-none d-lg-inline-block">
              <i class="fa-solid fa-clock-rotate-left"></i>
            </span>
            <span class="nav-link-title">Assessment History</span>
          </a>
        </li>

        <li class="nav-item">
          <a class="nav-link {% if request.resolver_match.url_name == 'my_profile' %}active{% endif %}"
             href="{% url 'my_profile' %}">
            <span class="nav-link-icon d-md-none d-lg-inline-block">
              <i class="fa-solid fa-user"></i>
            </span>
            <span class="nav-link-title">My Profile</span>
          </a>
        </li>

        {% if user.is_authenticated %}
        <li class="nav-item d-lg-none">
          <a class="nav-link" href="{% url 'logout' %}">
            <span class="nav-link-icon d-md-none d-lg-inline-block">
              <i class="nav-icon fas fa-sign-out-alt"></i>
            </span>
            <span class="nav-link-title">Logout</span>
          </a>
        </li>
        {% endif %}

      </ul>
    </div>
  </div>
</aside>
